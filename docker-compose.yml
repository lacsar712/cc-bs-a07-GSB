services:
  db:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: bridgestrain
    ports:
      - "54398:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bridgestrain"]
      interval: 3s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    command:
      [
        "sanic",
        "api.app",
        "--host=0.0.0.0",
        "--port=8000",
        "--single-process",
      ]
    ports:
      - "8198:8000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/bridgestrain
      JWT_SECRET: bridge-strain-dev-secret
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./backend
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/bridgestrain
      WORKER_POLL_SECONDS: "1"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    ports:
      - "3198:80"
    depends_on:
      - backend

volumes:
  pgdata:
